<style>
  :root{
    --bg:#0F1620; --panel:#16202C; --panel2:#1C2833; --border:#253A4A;
    --text:#ECF1F6; --muted:#7E9AB0; --accent:#1A91FF; --navy:#173C5E; --green:#3FC17E; --red:#F0556A;
    --font: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --mono: 'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);}
  body{font-family:var(--font); color:var(--text);}
  #root{min-height:100vh; display:flex;}
  * { -webkit-tap-highlight-color: transparent; }
  .disp{font-weight:800; text-transform:uppercase; letter-spacing:0.01em;}
  .mono{font-family:var(--mono);}
  .badge{display:inline-flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:0.06em;padding:3px 7px;border-radius:4px;background:color-mix(in srgb, var(--c) 18%, transparent);color:var(--c);border:1px solid color-mix(in srgb, var(--c) 45%, transparent);}
  .sidebar{width:200px; background:var(--panel); border-right:1px solid var(--border); padding:20px 14px; display:flex; flex-direction:column; gap:4px; flex-shrink:0;}
  .brand{display:flex; align-items:center; gap:8px; margin-bottom:22px; padding:0 6px;}
  .brand .mark{width:32px; height:32px; border-radius:8px; background:#fff; display:flex; align-items:center; justify-content:center; padding:5px; flex-shrink:0;}
  .brand .mark img{width:100%; height:100%; object-fit:contain; display:block;}
  .brand .name{font-weight:800; font-size:20px; letter-spacing:0.02em; text-transform:uppercase;}
  .navitem{display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:8px; cursor:pointer; color:var(--muted); font-size:13.5px; font-weight:500; border:1px solid transparent;}
  .navitem:hover{background:var(--panel2); color:var(--text);}
  .navitem.active{background:var(--panel2); color:var(--text); border-color:var(--border);}
  .navitem .dot{width:8px; height:8px; border-radius:2px; flex-shrink:0;}
  .navcount{margin-left:auto; font-family:var(--mono); font-size:10.5px; color:var(--muted);}
  .navsection{font-size:10px; letter-spacing:0.12em; color:#5B6167; text-transform:uppercase; margin:14px 8px 4px; font-weight:700;}
  .main{flex:1; padding:22px 26px; overflow-y:auto; height:100vh;}
  .topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; flex-wrap:wrap; gap:10px;}
  .topbar-actions{display:flex; align-items:center; gap:8px;}
  .save-btn{background:var(--navy); color:#fff; border:1px solid #2C5D89;}
  .save-btn:hover{background:#1E4A73;}
  .pagetitle{font-weight:800; font-size:26px; text-transform:uppercase; display:flex; align-items:center; gap:10px;}
  .subtitle{color:var(--muted); font-size:12.5px; margin-top:2px;}
  .sectiontitle{margin-bottom:8px; font-weight:700; color:var(--text); font-size:13px;}
  .btn{display:inline-flex; align-items:center; gap:6px; background:var(--accent); color:#1B1300; border:none; padding:9px 14px; border-radius:8px; font-weight:700; font-size:13px; cursor:pointer;}
  .btn:hover{filter:brightness(1.08);}
  .btn.secondary{background:var(--panel2); color:var(--text); border:1px solid var(--border);}
  .btn.ghost{background:transparent; color:var(--muted); border:1px solid var(--border);}
  .btn:disabled{opacity:0.4; cursor:not-allowed;}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px;}
  .card{background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:14px; position:relative; overflow:hidden;}
  .card::before{content:''; position:absolute; top:0; left:0; right:0; height:3px; background:var(--c);}
  .card-top{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px;}
  .card-name{font-weight:600; font-size:14.5px; line-height:1.25;}
  .card-sku{font-family:var(--mono); font-size:10px; color:var(--muted); margin-top:2px;}
  .card-row{display:flex; justify-content:space-between; font-size:12.5px; color:var(--muted); margin-top:6px;}
  .card-row b{color:var(--text); font-family:var(--mono); font-weight:600;}
  .card-actions{display:flex; gap:6px; margin-top:12px;}
  .card-actions .btn{flex:1; justify-content:center; padding:7px; font-size:12px;}
  .qty-tag{font-family:var(--mono); font-size:11px; padding:2px 7px; border-radius:5px; background:var(--panel2); border:1px solid var(--border);}
  .qty-tag.low{color:var(--red); border-color:color-mix(in srgb, var(--red) 40%, transparent);}
  .empty{border:1px dashed var(--border); border-radius:12px; padding:44px 20px; text-align:center; color:var(--muted);}
  .empty .disp{font-size:20px; color:var(--text); margin-bottom:6px;}
  .kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:22px;}
  .kpi{background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:14px;}
  .kpi .label{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:6px;}
  .kpi .value{font-family:var(--mono); font-size:20px; font-weight:700;}
  .kpi .value.pos{color:var(--green);}
  .kpi .value.neg{color:var(--red);}
  .tablewrap{background:var(--panel); border:1px solid var(--border); border-radius:10px; overflow:hidden; overflow-x:auto;}
  .trow{display:grid; grid-template-columns:1.6fr 0.6fr 0.9fr 0.9fr 0.9fr 0.9fr; gap:8px; padding:10px 14px; font-size:12.5px; align-items:center; min-width:520px;}
  .trow.head{color:var(--muted); font-size:10.5px; text-transform:uppercase; letter-spacing:0.05em; border-bottom:1px solid var(--border); font-weight:700;}
  .trow:not(.head){border-bottom:1px solid var(--border);}
  .trow:last-child{border-bottom:none;}
  .profit-pos{color:var(--green); font-family:var(--mono); font-weight:700;}
  .profit-neg{color:var(--red); font-family:var(--mono); font-weight:700;}
  .bar-row{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--border); font-size:12.5px;}
  .bar-row:last-child{border-bottom:none;}
  .bar-track{flex:1; height:6px; background:var(--panel2); border-radius:3px; overflow:hidden;}
  .bar-fill{height:100%; background:var(--accent); border-radius:3px;}
  .overlay{position:fixed; inset:0; background:rgba(10,11,13,0.65); display:flex; align-items:center; justify-content:center; z-index:50; padding:16px;}
  .modal{background:var(--panel); border:1px solid var(--border); border-radius:12px; width:380px; max-width:100%; padding:20px;}
  .modal h3{text-transform:uppercase; font-size:19px; font-weight:800; margin:0 0 14px; display:flex; justify-content:space-between; align-items:center;}
  .modal h3 svg{cursor:pointer; color:var(--muted);}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:11.5px; color:var(--muted); margin-bottom:5px; font-weight:600;}
  .field input{width:100%; background:var(--panel2); border:1px solid var(--border); color:var(--text); padding:9px 10px; border-radius:7px; font-size:13px; font-family:var(--font);}
  .field input:focus{outline:none; border-color:var(--accent);}
  .row2{display:flex; gap:10px;}
  .comp-picker{display:grid; grid-template-columns:repeat(4,1fr); gap:6px;}
  .comp-opt{border:1px solid var(--border); border-radius:7px; padding:8px 4px; text-align:center; font-size:11px; cursor:pointer; color:var(--muted); font-weight:600;}
  .comp-opt.sel{border-color:var(--c); color:var(--c); background:color-mix(in srgb, var(--c) 12%, transparent);}
  .modal-actions{display:flex; gap:8px; margin-top:16px;}
  .modal-actions .btn{flex:1; justify-content:center;}
  .sell-preview{background:var(--panel2); border-radius:8px; padding:10px 12px; font-size:12.5px; margin-top:4px; display:flex; justify-content:space-between;}
  .toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--panel2); border:1px solid var(--border); color:var(--text); padding:10px 16px; border-radius:8px; font-size:13px; z-index:60; box-shadow:0 8px 24px rgba(0,0,0,0.4);}
  @media (max-width:640px){
    #root{flex-direction:column;}
    .sidebar{width:100%; flex-direction:row; overflow-x:auto; padding:12px; gap:6px;}
    .navsection{display:none;}
    .main{height:auto; min-height:calc(100vh - 68px);}
  }
</style>

<body>
<div id="root"></div>

<script>
"use strict";

/* ---------------- data ---------------- */
var COMPARTMENTS = [
  { id: "stock1", label: "Stock Mellah", short: "MEL", color: "#1A91FF" },
  { id: "stock2", label: "Stock Chine", short: "CHI", color: "#5AC8FF" },
  { id: "stock3", label: "Stock Mansour", short: "MAN", color: "#2C5D89" },
  { id: "magazine", label: "Magazine", short: "MG", color: "#F0556A" }
];
function compById(id){ for (var i=0;i<COMPARTMENTS.length;i++){ if(COMPARTMENTS[i].id===id) return COMPARTMENTS[i]; } return null; }
function uid(){ return Math.random().toString(36).slice(2,10); }
function money(n){ n = Number(n||0); return n.toFixed(2) + " MAD"; }
function escapeHtml(s){
  return String(s==null?"":s).replace(/[&<>"']/g, function(c){
    return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c];
  });
}

/* ---------------- storage ---------------- */
function loadArr(key){
  try{ var v = localStorage.getItem(key); return v ? JSON.parse(v) : []; }catch(e){ return []; }
}
function saveArr(key, arr){
  try{ localStorage.setItem(key, JSON.stringify(arr)); }catch(e){}
}

/* ---------------- state ---------------- */
var state = {
  products: loadArr("depot:products"),
  sales: loadArr("depot:sales"),
  view: "dashboard",
  modal: null,   // {type:'add'} | {type:'sell', productId}
  addForm: { name:"", sku:"", qty:"1", buyPrice:"", compartment:"stock1" },
  sellForm: { qty:"1", sellPrice:"" },
  toast: null,
  toastTimer: null
};

function persist(){
  saveArr("depot:products", state.products);
  saveArr("depot:sales", state.sales);
}

/* ---------------- icons (inline svg, no deps) ---------------- */
function icon(name, size){
  size = size || 15;
  var paths = {
    plus: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
    package: '<path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/>',
    trendingUp: '<polyline points="3 17 9 11 13 15 21 7"/><polyline points="14 7 21 7 21 14"/>',
    x: '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
    bookOpen: '<path d="M2 4h7a4 4 0 0 1 4 4v12a3 3 0 0 0-3-3H2z"/><path d="M22 4h-7a4 4 0 0 0-4 4v12a3 3 0 0 1 3-3h8z"/>',
    trash2: '<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/>',
    dollarSign: '<line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>',
    layoutGrid: '<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>',
    save: '<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>'
  };
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+(paths[name]||"")+'</svg>';
}

/* ---------------- render ---------------- */
var root = document.getElementById("root");

function badge(compId){
  var c = compById(compId);
  if(!c) return "";
  return '<span class="badge" style="--c:'+c.color+'">'+c.short+'</span>';
}

function computeStats(){
  var totalRevenue=0, totalCost=0, totalProfit=0;
  state.sales.forEach(function(s){ totalRevenue+=s.revenue; totalCost+=s.buyPrice*s.qty; totalProfit+=s.profit; });
  var margin = totalRevenue>0 ? (totalProfit/totalRevenue)*100 : 0;
  var inventoryValue=0;
  state.products.forEach(function(p){ inventoryValue += p.buyPrice*p.qty; });
  var byProduct = {};
  state.sales.forEach(function(s){
    if(!byProduct[s.productName]) byProduct[s.productName] = {name:s.productName, profit:0};
    byProduct[s.productName].profit += s.profit;
  });
  var ranked = Object.keys(byProduct).map(function(k){ return byProduct[k]; }).sort(function(a,b){ return b.profit-a.profit; });
  return {totalRevenue:totalRevenue, totalCost:totalCost, totalProfit:totalProfit, margin:margin, inventoryValue:inventoryValue, ranked:ranked};
}

function renderDashboard(){
  var s = computeStats();
  var html = '<div class="kpis">';
  html += '<div class="kpi"><div class="label">Total revenue</div><div class="value">'+money(s.totalRevenue)+'</div></div>';
  html += '<div class="kpi"><div class="label">Total cost</div><div class="value">'+money(s.totalCost)+'</div></div>';
  html += '<div class="kpi"><div class="label">Total profit</div><div class="value '+(s.totalProfit>=0?"pos":"neg")+'">'+(s.totalProfit>=0?"+":"-")+money(Math.abs(s.totalProfit))+'</div></div>';
  html += '<div class="kpi"><div class="label">Margin</div><div class="value '+(s.margin>=0?"pos":"neg")+'">'+s.margin.toFixed(1)+'%</div></div>';
  html += '<div class="kpi"><div class="label">Inventory value</div><div class="value">'+money(s.inventoryValue)+'</div></div>';
  html += '</div>';

  if(s.ranked.length>0){
    var max = Math.max.apply(null, s.ranked.map(function(r){ return Math.abs(r.profit); }).concat([1]));
    html += '<div class="sectiontitle">Profit by product</div><div class="tablewrap" style="padding:6px 14px;margin-bottom:22px;">';
    s.ranked.forEach(function(p){
      html += '<div class="bar-row"><div style="width:130px;flex-shrink:0;">'+escapeHtml(p.name)+'</div>';
      html += '<div class="bar-track"><div class="bar-fill" style="width:'+((Math.abs(p.profit)/max)*100)+'%;background:'+(p.profit>=0?"var(--green)":"var(--red)")+'"></div></div>';
      html += '<div class="'+(p.profit>=0?"profit-pos":"profit-neg")+'" style="width:90px;text-align:right;">'+(p.profit>=0?"+":"-")+money(Math.abs(p.profit))+'</div></div>';
    });
    html += '</div>';
  }

  html += '<div class="sectiontitle">Sales history</div>';
  if(state.sales.length===0){
    html += '<div class="empty"><div class="disp">No sales yet</div>Sell an item to see it show up here.</div>';
  } else {
    html += '<div class="tablewrap"><div class="trow head"><div>Product</div><div>Qty</div><div>Buy</div><div>Sell</div><div>Revenue</div><div>Profit</div></div>';
    state.sales.forEach(function(sale){
      html += '<div class="trow"><div style="display:flex;align-items:center;gap:6px;">'+badge(sale.compartment)+escapeHtml(sale.productName)+'</div>';
      html += '<div class="mono">'+sale.qty+'</div><div class="mono">'+money(sale.buyPrice)+'</div><div class="mono">'+money(sale.sellPrice)+'</div><div class="mono">'+money(sale.revenue)+'</div>';
      html += '<div class="'+(sale.profit>=0?"profit-pos":"profit-neg")+'">'+(sale.profit>=0?"+":"-")+money(Math.abs(sale.profit))+'</div></div>';
    });
    html += '</div>';
  }
  return html;
}

function renderItems(){
  var list = (state.view==="all") ? state.products : state.products.filter(function(p){ return p.compartment===state.view; });
  if(list.length===0){
    return '<div class="empty"><div class="disp">This bin is empty</div>Add your first item to start tracking it.'
      + '<div style="margin-top:14px;"><button class="btn" data-action="open-add" style="margin:0 auto;">'+icon("plus",15)+' Add item</button></div></div>';
  }
  var html = '<div class="grid">';
  list.forEach(function(p){
    var c = compById(p.compartment);
    var productSales = state.sales.filter(function(s){ return s.productId===p.id; });
    var profitToDate = productSales.reduce(function(a,s){ return a+s.profit; }, 0);
    html += '<div class="card" style="--c:'+c.color+'">';
    html += '<div class="card-top"><div><div class="card-name">'+escapeHtml(p.name)+'</div><div class="card-sku">'+escapeHtml(p.sku)+'</div></div>'+badge(p.compartment)+'</div>';
    html += '<div class="card-row"><span>In stock</span><span class="qty-tag '+(p.qty===0?"low":"")+'">'+p.qty+' units</span></div>';
    html += '<div class="card-row"><span>Buy price</span><b>'+money(p.buyPrice)+'</b></div>';
    if(productSales.length>0){
      html += '<div class="card-row"><span>Profit to date</span><b style="color:'+(profitToDate>=0?"var(--green)":"var(--red)")+'">'+(profitToDate>=0?"+":"-")+money(Math.abs(profitToDate))+'</b></div>';
    }
    html += '<div class="card-actions">';
    html += '<button class="btn secondary" '+(p.qty===0?"disabled":"")+' data-action="open-sell" data-id="'+p.id+'">'+icon("dollarSign",13)+' Sell</button>';
    html += '<button class="btn ghost" data-action="delete" data-id="'+p.id+'">'+icon("trash2",13)+'</button>';
    html += '</div></div>';
  });
  html += '</div>';
  return html;
}

function renderMain(){
  var list = (state.view==="all"||state.view==="dashboard") ? state.products : state.products.filter(function(p){ return p.compartment===state.view; });
  var title = state.view==="dashboard" ? "Dashboard" : state.view==="all" ? "All Items" : compById(state.view).label;
  var subtitle = state.view==="dashboard"
    ? "Revenue, cost & profit across every sale"
    : list.length+" item"+(list.length===1?"":"s")+" · "+list.reduce(function(a,p){return a+p.qty;},0)+" units in stock";

  var html = '<div class="main"><div class="topbar"><div><div class="pagetitle">'+title+'</div><div class="subtitle">'+subtitle+'</div></div>';
  html += '<div class="topbar-actions">';
  html += '<button class="btn save-btn" data-action="save">'+icon("save",16)+' Save</button>';
  if(state.view!=="dashboard"){
    html += '<button class="btn" data-action="open-add">'+icon("plus",15)+' Add item</button>';
  }
  html += '</div></div>';
  html += (state.view==="dashboard") ? renderDashboard() : renderItems();
  html += '</div>';
  return html;
}

function renderAddModal(){
  var f = state.addForm;
  var canSubmit = f.name.trim() && f.qty!=="" && f.buyPrice!=="";
  var html = '<div class="overlay" data-action="close-modal"><div class="modal" onclick="event.stopPropagation()">';
  html += '<h3>Add item <span data-action="close-modal">'+icon("x",18)+'</span></h3>';
  html += '<div class="field"><label>Name</label><input id="f-name" value="'+escapeHtml(f.name)+'" oninput="onAddField(\'name\', this.value)" placeholder="e.g. Bluetooth speaker" /></div>';
  html += '<div class="field"><label>SKU (optional)</label><input id="f-sku" value="'+escapeHtml(f.sku)+'" oninput="onAddField(\'sku\', this.value)" placeholder="auto-generated if left blank" /></div>';
  html += '<div class="field"><label>Compartment</label><div class="comp-picker">';
  COMPARTMENTS.forEach(function(c){
    html += '<div class="comp-opt '+(f.compartment===c.id?"sel":"")+'" style="--c:'+c.color+'" data-action="select-comp" data-comp="'+c.id+'">'+c.short+'</div>';
  });
  html += '</div></div>';
  html += '<div class="row2"><div class="field" style="flex:1;"><label>Quantity</label><input id="f-qty" type="number" min="0" value="'+escapeHtml(f.qty)+'" oninput="onAddField(\'qty\', this.value)" /></div>';
  html += '<div class="field" style="flex:1;"><label>Buy price / unit (MAD)</label><input id="f-buy" type="number" min="0" step="0.01" value="'+escapeHtml(f.buyPrice)+'" oninput="onAddField(\'buyPrice\', this.value)" placeholder="0.00" /></div></div>';
  html += '<div class="modal-actions"><button class="btn secondary" data-action="close-modal">Cancel</button>';
  html += '<button class="btn" '+(canSubmit?"":"disabled")+' data-action="submit-add">Add to '+compById(f.compartment).label+'</button></div>';
  html += '</div></div>';
  return html;
}

function renderSellModal(){
  var p = state.products.find(function(x){ return x.id===state.modal.productId; });
  if(!p) return "";
  var f = state.sellForm;
  var q = Number(f.qty)||0, sp = Number(f.sellPrice)||0;
  var profit = (sp - p.buyPrice) * q;
  var canSubmit = q>0 && q<=p.qty && f.sellPrice!=="";
  var html = '<div class="overlay" data-action="close-modal"><div class="modal" onclick="event.stopPropagation()">';
  html += '<h3>Sell '+escapeHtml(p.name)+' <span data-action="close-modal">'+icon("x",18)+'</span></h3>';
  html += '<div class="subtitle" style="margin-bottom:12px;">'+p.qty+' units available · bought at '+money(p.buyPrice)+' / unit</div>';
  html += '<div class="row2"><div class="field" style="flex:1;"><label>Quantity to sell</label><input id="f-sqty" type="number" min="1" max="'+p.qty+'" value="'+escapeHtml(f.qty)+'" oninput="onSellField(\'qty\', this.value)" /></div>';
  html += '<div class="field" style="flex:1;"><label>Selling price / unit (MAD)</label><input id="f-sprice" type="number" min="0" step="0.01" value="'+escapeHtml(f.sellPrice)+'" oninput="onSellField(\'sellPrice\', this.value)" placeholder="0.00" /></div></div>';
  html += '<div class="sell-preview"><span>Estimated profit</span><b style="color:'+(profit>=0?"var(--green)":"var(--red)")+';font-family:var(--mono);">'+(profit>=0?"+":"-")+money(Math.abs(profit))+'</b></div>';
  html += '<div class="modal-actions"><button class="btn secondary" data-action="close-modal">Cancel</button>';
  html += '<button class="btn" '+(canSubmit?"":"disabled")+' data-action="submit-sell">Confirm sale</button></div>';
  html += '</div></div>';
  return html;
}

function renderToast(){
  if(!state.toast) return "";
  return '<div class="toast">'+escapeHtml(state.toast)+'</div>';
}

function render(){
  var active = document.activeElement;
  var activeId = active && active.id;
  var selStart, selEnd;
  if(activeId && active.setSelectionRange){ selStart = active.selectionStart; selEnd = active.selectionEnd; }

  var html = renderSidebar() + renderMain();
  if(state.modal){
    if(state.modal.type==="add") html += renderAddModal();
    if(state.modal.type==="sell") html += renderSellModal();
  }
  html += renderToast();
  root.innerHTML = html;

  if(activeId){
    var el = document.getElementById(activeId);
    if(el){
      el.focus();
      if(selStart!=null && el.setSelectionRange){
        try{ el.setSelectionRange(selStart, selEnd); }catch(e){}
      }
    }
  }
}

/* ---------------- actions ---------------- */
function showToast(msg){
  state.toast = msg;
  render();
  if(state.toastTimer) clearTimeout(state.toastTimer);
  state.toastTimer = setTimeout(function(){ state.toast=null; render(); }, 2200);
}

window.onAddField = function(key, val){ state.addForm[key] = val; render(); };
window.onSellField = function(key, val){ state.sellForm[key] = val; render(); };

function openAdd(){
  state.addForm = { name:"", sku:"", qty:"1", buyPrice:"", compartment: COMPARTMENTS.some(function(c){return c.id===state.view;}) ? state.view : "stock1" };
  state.modal = {type:"add"};
  render();
}
function openSell(id){
  state.sellForm = { qty:"1", sellPrice:"" };
  state.modal = {type:"sell", productId:id};
  render();
}
function closeModal(){ state.modal = null; render(); }

function submitAdd(){
  var f = state.addForm;
  if(!(f.name.trim() && f.qty!=="" && f.buyPrice!=="")) return;
  var item = {
    id: uid(),
    name: f.name.trim(),
    sku: f.sku.trim() || ("DP-" + uid().toUpperCase().slice(0,5)),
    compartment: f.compartment,
    qty: Number(f.qty),
    buyPrice: Number(f.buyPrice),
    createdAt: Date.now()
  };
  state.products.unshift(item);
  persist();
  state.modal = null;
  showToast(item.name + " added to " + compById(item.compartment).label);
}

function submitSell(){
  var p = state.products.find(function(x){ return x.id===state.modal.productId; });
  if(!p) return;
  var qty = Number(state.sellForm.qty), sellPrice = Number(state.sellForm.sellPrice);
  if(qty<=0 || qty>p.qty || state.sellForm.sellPrice==="") return;
  var profit = (sellPrice - p.buyPrice) * qty;
  var sale = {
    id: uid(), productId:p.id, productName:p.name, sku:p.sku, compartment:p.compartment,
    qty:qty, buyPrice:p.buyPrice, sellPrice:sellPrice, revenue:sellPrice*qty, profit:profit, date:Date.now()
  };
  state.sales.unshift(sale);
  p.qty -= qty;
  persist();
  state.modal = null;
  showToast(profit>=0
    ? "Sold "+qty+"x "+p.name+" — profit "+money(profit)
    : "Sold "+qty+"x "+p.name+" — loss "+money(Math.abs(profit)));
}

function deleteProduct(id){
  state.products = state.products.filter(function(p){ return p.id!==id; });
  persist();
  render();
}

/* ---------------- event delegation ---------------- */
root.addEventListener("click", function(e){
  var t = e.target.closest("[data-action]");
  if(!t) return;
  var action = t.dataset.action;
  if(action==="nav"){ state.view = t.dataset.view; render(); }
  else if(action==="open-add"){ openAdd(); }
  else if(action==="open-sell"){ openSell(t.dataset.id); }
  else if(action==="close-modal"){ closeModal(); }
  else if(action==="select-comp"){ state.addForm.compartment = t.dataset.comp; render(); }
  else if(action==="submit-add"){ submitAdd(); }
  else if(action==="submit-sell"){ submitSell(); }
  else if(action==="delete"){ deleteProduct(t.dataset.id); }
  else if(action==="save"){ persist(); showToast("All changes saved ✓"); }
});

render();
</script>
</body>
</html>
